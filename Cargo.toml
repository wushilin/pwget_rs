[package]
name = "pwget_rs"
version = "0.2.3"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "pwget"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
crc32fast = "1.5.2"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
futures-util = "0.3.34"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "json", "stream", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util = "0.7.19"
url = "2.5.8"
percent-encoding = "2.3.2"
